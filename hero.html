<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JR.Group | Houston Luxury Real Estate Hero Showcase</title>
  <meta name="description" content="Showcase of the high-end luxury real estate hero section for JR Group in Houston.">
  
  <!-- Google Fonts: Playfair Display & Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Hero Showcase Stylesheet -->
  <link rel="stylesheet" href="/css/hero.css">
</head>
<body>

  <!-- HERO SECTION WITH TOP NAV -->
  <section class="hero-container" id="hero-section">
    
    <!-- TODO: To replace the flat background color (#14110F) with a full-bleed property photo or muted looping video, 
         uncomment the background-media wrapper below, and adjust the container positioning to relative.
         
         <div class="hero-media-wrapper">
           <video autoplay muted loop playsinline class="hero-media-video">
             <source src="/path-to-video.mp4" type="video/mp4">
           </video>
           <div class="hero-media-overlay"></div>
         </div>
    -->

    <!-- TOP NAVIGATION -->
    <header class="top-nav">
      <div class="nav-logo">
        JR<span class="logo-dot">.</span>Group
      </div>
      
      <!-- Desktop & Mobile navigation links wrapper -->
      <nav class="nav-menu" id="navMenu">
        <ul class="nav-links">
          <li><a href="/about.html" class="nav-link">About</a></li>
          <li><a href="/buy.html" class="nav-link">Buy</a></li>
          <li><a href="/sell.html" class="nav-link">Sell</a></li>
          <li><a href="/sold-portfolio.html" class="nav-link">Sold Portfolio</a></li>
        </ul>
      </nav>
      
      <div class="nav-actions">
        <a class="run-light" href="/contact.html" aria-label="Free home valuation">
          <span class="face">Free home valuation</span>
        </a>
        
        <!-- Mobile Menu Toggle Button -->
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="navMenu">
          <span class="bar bar-top"></span>
          <span class="bar bar-mid"></span>
          <span class="bar bar-bot"></span>
        </button>
      </div>
    </header>

    <!-- HERO CONTENT -->
    <div class="hero-content-wrapper">
      <div class="hero-body">
        
        <!-- Main Headline -->
        <h1 class="hero-headline">
          Where your real estate <br class="desktop-br"><em>journey begins</em>
        </h1>
        
        <!-- Subhead -->
        <p class="hero-subhead">
          Helping clients buy and sell exceptional homes.
        </p>
        
        <div class="hero-buttons-new">
          <a href="/contact.html" class="btn-frame btn-frame--primary" id="cta-consultation" aria-label="Schedule free consultation">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar" aria-hidden="true">
              <path d="M8 2v4"/>
              <path d="M16 2v4"/>
              <rect width="18" height="18" x="3" y="4" rx="2"/>
              <path d="M3 10h18"/>
            </svg>
            <span>Schedule free consultation</span>
            <span class="c c1"></span>
            <span class="c c2"></span>
            <span class="c c3"></span>
            <span class="c c4"></span>
          </a>
          <!-- Buttons Row -->
          <div class="hero-button-row">
            
            <!-- Buy Your Home Button -->
            <a href="/buy.html" class="btn-frame" id="btn-buy" aria-label="Buy your home">
              <!-- Inline Lucide Home Icon -->
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-home" aria-hidden="true">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              <span>Buy your home</span>
              <span class="c c1"></span>
              <span class="c c2"></span>
              <span class="c c3"></span>
              <span class="c c4"></span>
            </a>

            <!-- Sell Your Property Button -->
            <a href="/sell.html" class="btn-frame" id="btn-sell" aria-label="Sell your property">
              <!-- Inline Lucide Tag Icon -->
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-tag" aria-hidden="true">
                <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.42 2.42 0 0 0 3.42 0l6.586-6.586a2.42 2.42 0 0 0 0-3.42z"/>
                <circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/>
              </svg>
              <span>Sell your property</span>
              <span class="c c1"></span>
              <span class="c c2"></span>
              <span class="c c3"></span>
              <span class="c c4"></span>
            </a>

          </div>
        </div>

      </div>
    </div>

    <!-- SCROLL CUE -->
    <div class="scroll-cue">
      <span class="scroll-label">SCROLL</span>
      <div class="scroll-line"></div>
    </div>

  </section>

  <!-- Mobile Nav Toggle Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const mobileBtn = document.getElementById('mobileMenuBtn');
      const navMenu = document.getElementById('navMenu');
      
      if (mobileBtn && navMenu) {
        mobileBtn.addEventListener('click', () => {
          const isExpanded = mobileBtn.getAttribute('aria-expanded') === 'true';
          mobileBtn.setAttribute('aria-expanded', !isExpanded);
          navMenu.classList.toggle('is-active');
          mobileBtn.classList.toggle('is-active');
        });
      }
    });
  </script>

</body>
</html>
