<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JR Group — Live Visual Editor</title>
  
  <!-- Font Integrations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;0,6..96,800;0,6..96,900;1,6..96,400;1,6..96,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  
  <!-- Website Styling -->
  <link rel="stylesheet" href="/css/index.css" />
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Admin Override Styles */
    :root {
      --admin-gold: #B08D57;
      --admin-dark: #0f0d0c;
      --admin-border: rgba(176, 141, 87, 0.3);
    }

    body.admin-mode {
      padding-top: 64px !important;
    }

    /* Sticky Control Toolbar */
    .admin-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: #110e0c;
      border-bottom: 2px solid var(--admin-gold);
      box-shadow: 0 4px 25px rgba(0,0,0,0.5);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-family: 'Inter', sans-serif;
      color: #f5f3ef;
    }

    .admin-bar__logo {
      font-family: 'Bodoni Moda', serif;
      font-size: 18px;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .admin-bar__logo span {
      color: var(--admin-gold);
    }

    .admin-bar__controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-bar__select {
      background: #1c1815;
      border: 1px solid var(--admin-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
      cursor: pointer;
    }

    .admin-bar__btn {
      background: transparent;
      border: 1px solid var(--admin-border);
      color: #f5f3ef;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .admin-bar__btn:hover {
      background: rgba(255,255,255,0.03);
    }

    .admin-bar__btn--primary {
      background: var(--admin-gold);
      color: #0f0d0c;
      border-color: var(--admin-gold);
    }

    .admin-bar__btn--primary:hover {
      background: #c5a673;
    }

    .admin-bar__btn--danger {
      color: #d9534f;
      background: rgba(217, 83, 79, 0.05);
      border-color: rgba(217, 83, 79, 0.2);
    }

    .admin-bar__btn--danger:hover {
      background: rgba(217, 83, 79, 0.15);
    }

    /* WYSIWYG Editable Text */
    [contenteditable="true"] {
      outline: none;
      transition: all 0.2s ease;
      position: relative;
    }

    [contenteditable="true"]:hover {
      box-shadow: 0 0 0 2px rgba(176, 141, 87, 0.4);
      cursor: text;
    }

    [contenteditable="true"]:focus {
      box-shadow: 0 0 0 2px var(--admin-gold);
      background: rgba(176, 141, 87, 0.05);
    }

    /* WYSIWYG Editable Images */
    .edit-img-wrap {
      position: relative;
      cursor: pointer;
    }

    .edit-img-wrap::after {
      content: 'Change Image';
      position: absolute;
      inset: 0;
      background: rgba(10, 8, 7, 0.75);
      color: var(--admin-gold);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      border: 2px dashed var(--admin-gold);
      border-radius: inherit;
      pointer-events: none;
      z-index: 10;
    }

    .edit-img-wrap:hover::after {
      opacity: 1;
    }

    /* Auth Screens */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b1613 0%, #0a0807 100%);
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Inter', sans-serif;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #151210;
      border: 1px solid var(--admin-border);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      color: #fff;
    }

    .auth-card h1 {
      font-family: 'Bodoni Moda', serif;
      font-size: 26px;
      letter-spacing: 0.05em;
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-card h1 span {
      color: var(--admin-gold);
    }

    .auth-card p.sub {
      text-align: center;
      color: #a39e95;
      font-size: 13px;
      margin-bottom: 28px;
    }

    .fld {
      display: block;
      margin-bottom: 18px;
    }

    .fld span {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a39e95;
      margin-bottom: 6px;
    }

    .fld input {
      background: #1b1715;
      border: 1px solid var(--admin-border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      width: 100%;
      outline: none;
      transition: all 0.2s;
    }

    .fld input:focus {
      border-color: var(--admin-gold);
      box-shadow: 0 0 0 3px rgba(176, 141, 87, 0.15);
    }

    .auth-card .btn-primary {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      background: var(--admin-gold);
      color: #0f0d0c;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .auth-card .btn-primary:hover {
      background: #c5a673;
    }

    /* Admin Add / Delete Helpers */
    .admin-add-card {
      border: 2px dashed var(--admin-border);
      background: rgba(176, 141, 87, 0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      border-radius: 12px;
      cursor: pointer;
      color: var(--admin-gold);
      font-weight: 600;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .admin-add-card:hover {
      background: rgba(176, 141, 87, 0.06);
      border-color: var(--admin-gold);
    }

    .card-edit-controls {
      display: flex;
      gap: 8px;
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
    }

    .btn-edit-badge {
      background: #d9534f;
      color: #fff;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-feat-badge {
      background: var(--admin-gold);
      color: #000;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Toasts */
    #toasts {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: #1c1815;
      color: #f5f3ef;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      border-left: 4px solid var(--admin-gold);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
    }

    .toast.success { border-left-color: #4cae4c; }
    .toast.error { border-left-color: #d9534f; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Inquiries Premium Table Styling */
    .inquiry-row-hover:hover {
      background: rgba(176, 141, 87, 0.04) !important;
    }
    .inquiry-table-wrapper::-webkit-scrollbar {
      height: 8px;
    }
    .inquiry-table-wrapper::-webkit-scrollbar-track {
      background: #151210;
    }
    .inquiry-table-wrapper::-webkit-scrollbar-thumb {
      background: var(--admin-gold);
      border-radius: 4px;
    }
  </style>
</head>
<body>

<!-- APP STRUCTURE -->
<div id="editor-bar-root"></div>
<div id="page-editor-root"></div>
<div id="auth-root"></div>
<div id="toasts"></div>
<div id="confirm-modal-root"></div>

<!-- Image file upload input hidden -->
<input type="file" id="global-img-file" accept="image/*" style="display: none;" />

<script type="module">
  const CFG_KEYS = { url: 'sb_url', key: 'sb_key' };
  let sb = null;
  let session = null;
  let activePage = 'home';
  let siteContent = {};
  
  // Data caches
  let dbListings = [];
  let dbBlogs = [];
  let dbCommunities = [];
  let dbBlocks = [];
  let dbInquiries = [];

  const $ = (s) => document.querySelector(s);

  function toast(msg, type = 'info') {
    const wrap = $('#toasts');
    if (!wrap) return;
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => {
      t.style.opacity = '0';
      setTimeout(() => t.remove(), 300);
    }, 3500);
  }

  window.customConfirm = function(message, onConfirm) {
    const root = $('#confirm-modal-root');
    if (!root) return;
    
    root.innerHTML = `
      <div class="auth-overlay" style="z-index: 100100; background: rgba(10, 8, 7, 0.85); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; position: fixed; inset: 0;">
        <div class="auth-card" style="max-width: 400px; text-align: center; border: 1px solid var(--admin-gold); background: #151210; padding: 32px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); color: #fff;">
          <h2 style="font-family: 'Bodoni Moda', serif; font-size: 22px; color: #fff; margin-bottom: 14px; margin-top: 0;">Confirm Action</h2>
          <p style="color: #cfcabf; font-size: 14px; line-height: 1.5; margin-bottom: 24px;">${escapeHtml(message)}</p>
          <div style="display: flex; gap: 12px; justify-content: center;">
            <button class="admin-bar__btn" id="confirm-cancel-btn" style="flex: 1;">Cancel</button>
            <button class="admin-bar__btn admin-bar__btn--primary" id="confirm-ok-btn" style="flex: 1; background: var(--admin-gold); color: #000;">Confirm</button>
          </div>
        </div>
      </div>
    `;
    
    $('#confirm-cancel-btn').onclick = () => {
      root.innerHTML = '';
    };
    
    $('#confirm-ok-btn').onclick = () => {
      root.innerHTML = '';
      onConfirm();
    };
  };

  // BOOT STRATEGY
  window.addEventListener('DOMContentLoaded', () => {
    boot();
  });

  window.saveConfig = function() {
    const url = $('#c_url').value.trim();
    const key = $('#c_key').value.trim();
    if (!url || !key) {
      toast('Both fields are required.', 'error');
      return;
    }
    localStorage.setItem(CFG_KEYS.url, url);
    localStorage.setItem(CFG_KEYS.key, key);
    boot();
  };

  window.changeConfig = function() {
    localStorage.removeItem(CFG_KEYS.url);
    localStorage.removeItem(CFG_KEYS.key);
    boot();
  };

  async function boot() {
    // Automatically fall back to Vite's environment variables if localStorage is empty
    let url = localStorage.getItem(CFG_KEYS.url);
    let key = localStorage.getItem(CFG_KEYS.key);

    if (!url || !key) {
      try {
        url = import.meta.env.VITE_SUPABASE_URL || '';
        key = import.meta.env.VITE_SUPABASE_ANON_KEY || '';
      } catch (e) {
        url = '';
        key = '';
      }
    }

    if (!url || !key) {
      renderConfigScreen();
      return;
    }

    try {
      if (!window.supabase) {
        throw new Error("Supabase library not loaded. Check your internet connection or CDN script.");
      }
      sb = window.supabase.createClient(url, key);
      const { data, error: authError } = await sb.auth.getSession();
      if (authError) throw authError;

      session = data.session;
      if (session) {
        document.body.classList.add('admin-mode');
        $('#auth-root').innerHTML = '';
        renderAdminBar();
        await loadAllDatabaseData();
        renderActivePage();
      } else {
        document.body.classList.remove('admin-mode');
        $('#editor-bar-root').innerHTML = '';
        $('#page-editor-root').innerHTML = '';
        renderLoginScreen();
      }
    } catch (err) {
      console.error("Boot error:", err);
      renderConfigScreen(err.message);
    }
  }

  // 1. Connection Config
  function renderConfigScreen(err = '') {
    const savedUrl = localStorage.getItem(CFG_KEYS.url) || '';
    const savedKey = localStorage.getItem(CFG_KEYS.key) || '';
    
    let tip = '';
    if (window.location.protocol === 'file:') {
      tip = `<div style="background: rgba(217, 83, 79, 0.15); border: 1px solid rgba(217, 83, 79, 0.3); padding: 12px; border-radius: 8px; font-size: 13px; color: #f2dede; margin-top: 14px; line-height: 1.5; text-align: left;">
        <strong>Protocol Error:</strong> You are accessing this page via a <code>file://</code> URL. Modern browsers block database requests from local files due to CORS. <br/><br/>
        Please start your local server with <code>npm run dev</code> and open <a href="http://localhost:5173/backroom.html" style="color: var(--admin-gold); text-decoration: underline;">http://localhost:5173/backroom.html</a>.
      </div>`;
    } else if (err && err.toLowerCase().includes('fetch')) {
      tip = `<div style="background: rgba(176, 141, 87, 0.1); border: 1px solid rgba(176, 141, 87, 0.3); padding: 12px; border-radius: 8px; font-size: 13px; color: #e5c185; margin-top: 14px; line-height: 1.5; text-align: left;">
        <strong>Connection Hint:</strong> This error usually occurs when:
        <ul style="margin: 6px 0 0 16px; padding: 0;">
          <li>Your internet connection is offline.</li>
          <li>A browser extension (such as an adblocker or Brave Shields) is blocking requests to <code>supabase.co</code>.</li>
          <li>The Supabase URL is incorrect or the database instance is paused.</li>
        </ul>
      </div>`;
    }

    $('#auth-root').innerHTML = `
      <div class="auth-overlay">
        <div class="auth-card" style="max-width: 460px;">
          <h1>JR<span>.</span>Group</h1>
          <p class="sub">Establish Database Portal Connection</p>
          <label class="fld"><span>Supabase Project URL</span><input type="text" id="c_url" placeholder="https://xxxx.supabase.co" value="${escapeHtml(savedUrl)}"></label>
          <label class="fld"><span>Anon Public Key</span><input type="password" id="c_key" placeholder="eyJhbGciOi..." value="${escapeHtml(savedKey)}"></label>
          <button class="btn-primary" onclick="saveConfig()">Save & Continue</button>
          ${err ? `<p style="color:#d9534f;text-align:center;font-size:12.5px;margin-top:14px;font-weight: 600;">Error: ${escapeHtml(err)}</p>` : ''}
          ${tip}
        </div>
      </div>
    `;
  }

  // 2. Login
  function renderLoginScreen() {
    $('#auth-root').innerHTML = `
      <div class="auth-overlay">
        <div class="auth-card">
          <h1>JR<span>.</span>Group</h1>
          <p class="sub">Back Room Live Visual Editor Login</p>
          <label class="fld"><span>Email</span><input type="email" id="login_email" placeholder="admin@jrgroup.com"></label>
          <label class="fld"><span>Password</span><input type="password" id="login_pass" placeholder="••••••••"></label>
          <button class="btn-primary" id="login_submit_btn" onclick="doLogin()">Sign In</button>
          <div style="text-align:center;font-size:12px;margin-top:20px;">
            <a onclick="changeConfig()" style="color:var(--admin-gold);cursor:pointer;">Change Connection Settings</a>
          </div>
        </div>
      </div>
    `;
    $('#login_pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  }

  window.doLogin = async function() {
    const email = $('#login_email').value.trim();
    const password = $('#login_pass').value;
    const btn = $('#login_submit_btn');

    if (!email || !password) {
      toast('Please enter email and password.', 'error');
      return;
    }

    btn.innerHTML = '<span class="spinner"></span> Signing In...';
    btn.disabled = true;

    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      session = data.session;
      toast('Authenticated.', 'success');
      boot();
    } catch (err) {
      toast(err.message, 'error');
      btn.innerHTML = 'Sign In';
      btn.disabled = false;
    }
  };

  window.doSignOut = function() {
    customConfirm('Sign out of Back Room editor?', async () => {
      try {
        await sb.auth.signOut();
        session = null;
        boot();
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  };

  // 3. Admin Topbar Bar
  function renderAdminBar() {
    $('#editor-bar-root').innerHTML = `
      <div class="admin-bar">
        <div class="admin-bar__logo">JR<span>.</span>Group <span>Live Editor</span></div>
        <div class="admin-bar__controls">
          <select class="admin-bar__select" id="page-selector" onchange="changeActivePage(this.value)">
            <option value="home">Page: Home</option>
            <option value="about">Page: About Joel</option>
            <option value="buy">Page: Buy</option>
            <option value="sell">Page: Sell</option>
            <option value="communities">Page: Communities</option>
            <option value="sold">Page: Sold Portfolio</option>
            <option value="blog">Page: Blog</option>
            <option value="contact_settings">Page: Contacts & Socials</option>
            <option value="inquiries">Form Submissions</option>
          </select>
          <button class="admin-bar__btn admin-bar__btn--primary" id="save-page-btn" onclick="savePageChanges()">Save Page Changes</button>
          <button class="admin-bar__btn admin-bar__btn--danger" onclick="doSignOut()">Sign Out</button>
        </div>
      </div>
    `;
  }

  window.changeActivePage = function(val) {
    activePage = val;
    renderActivePage();
  };

  // Fetch all db variables
  async function loadAllDatabaseData() {
    const [scRes, listRes, blogRes, commRes, blockRes] = await Promise.all([
      sb.from('site_content').select('*'),
      sb.from('listings').select('*'),
      sb.from('blog_posts').select('*'),
      sb.from('communities').select('*'),
      sb.from('content_blocks').select('*')
    ]);

    siteContent = {};
    if (scRes.data) scRes.data.forEach(x => siteContent[x.key] = x.value);
    dbListings = listRes.data || [];
    dbBlogs = blogRes.data || [];
    dbCommunities = commRes.data || [];
    dbBlocks = blockRes.data || [];

    try {
      const { data, error } = await sb.from('contact_inquiries').select('*');
      if (error) throw error;
      dbInquiries = data || [];
      dbInquiries.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
    } catch (e) {
      console.warn("Failed to load contact inquiries:", e);
      dbInquiries = [];
    }
  }

  // 4. Render Active Replicated Web Page
  function renderActivePage() {
    const root = $('#page-editor-root');
    
    const saveBtn = $('#save-page-btn');
    if (saveBtn) {
      saveBtn.style.display = (activePage === 'inquiries') ? 'none' : 'inline-block';
    }

    // Inject replicated navbar and base styling
    let pageHtml = `
      <nav id="main-nav" class="nav" style="position: absolute; top: 64px;">
        <div class="nav__inner">
          <a href="#" class="nav__logo"><img src="/jr-mark.webp" alt="JR" class="nav__logo-mark" /><span class="nav__logo-text">Group</span></a>
          <ul class="nav__links">
            <li><a class="${activePage === 'home'?'active':''}" onclick="setPageNav('home')">Home</a></li>
            <li><a class="${activePage === 'about'?'active':''}" onclick="setPageNav('about')">About Joel</a></li>
            <li><a class="${activePage === 'buy'?'active':''}" onclick="setPageNav('buy')">Buy</a></li>
            <li><a class="${activePage === 'sell'?'active':''}" onclick="setPageNav('sell')">Sell</a></li>
            <li><a class="${activePage === 'communities'?'active':''}" onclick="setPageNav('communities')">Communities</a></li>
            <li><a class="${activePage === 'sold'?'active':''}" onclick="setPageNav('sold')">Sold Portfolio</a></li>
            <li><a class="${activePage === 'blog'?'active':''}" onclick="setPageNav('blog')">Blog</a></li>
          </ul>
          <a class="run-light" href="#"><span class="face">Free home valuation</span></a>
        </div>
      </nav>
    `;

    if (activePage === 'home') pageHtml += getHomepageHtml();
    else if (activePage === 'about') pageHtml += getAboutpageHtml();
    else if (activePage === 'buy') pageHtml += getBuypageHtml();
    else if (activePage === 'sell') pageHtml += getSellpageHtml();
    else if (activePage === 'communities') pageHtml += getCommunitiespageHtml();
    else if (activePage === 'sold') pageHtml += getSoldpageHtml();
    else if (activePage === 'blog') pageHtml += getBlogpageHtml();
    else if (activePage === 'contact_settings') pageHtml += getContactSettingspageHtml();
    else if (activePage === 'inquiries') pageHtml += getInquiriesPageHtml();

    // Footer
    pageHtml += `
      <footer class="footer">
        <div class="footer__inner">
          <div class="footer__brand">
            <span class="footer__logo"><img src="/jr-mark.webp" alt="JR" class="footer__logo-mark" /><span class="footer__logo-text">Group</span></span>
            <p>Joel Joy | JR Group</p>
          </div>
          <div class="footer__links">
            <div class="footer__col">
              <h4>Properties</h4>
              <a href="/sold-portfolio.html">Sold Portfolio</a>
              <a href="/communities.html">Communities</a>
            </div>
            <div class="footer__col">
              <h4>Services</h4>
              <a href="#">Buy</a>
              <a href="#">Sell</a>
            </div>
            <div class="footer__col">
              <h4>Connect</h4>
              <a contenteditable="true" data-cms="footer_phone">${escapeHtml(siteContent.footer_phone || '(713) 555-1234')}</a>
              <a contenteditable="true" data-cms="footer_email">${escapeHtml(siteContent.footer_email || 'info@jrgroup.com')}</a>
              <a href="${escapeHtml(siteContent.social_instagram || '#')}" target="_blank">Instagram</a>

  window.filterInquiries = function() {
    const searchInput = $('#inquiry-search');
    const filterSelect = $('#inquiry-filter');
    const searchVal = searchInput ? searchInput.value.toLowerCase() : '';
    const filterVal = filterSelect ? filterSelect.value : 'all';
    
    const filtered = dbInquiries.filter(item => {
      const name = `${item.first_name || ''} ${item.last_name || ''}`.toLowerCase();
      const email = (item.email || '').toLowerCase();
      const phone = (item.phone || '').toLowerCase();
      const msg = (item.message || '').toLowerCase();
      const interest = (item.interest || '').toLowerCase();
      
      const matchesSearch = name.includes(searchVal) || email.includes(searchVal) || phone.includes(searchVal) || msg.includes(searchVal) || interest.includes(searchVal);
      
      let matchesFilter = true;
      if (filterVal === 'buy') {
        matchesFilter = interest.includes('buy') || interest.includes('acquisition') || interest.includes('purchase');
      } else if (filterVal === 'sell') {
        matchesFilter = interest.includes('sell') || interest.includes('valuation') || interest.includes('representation');
      } else if (filterVal === 'community') {
        matchesFilter = interest.includes('community');
      } else if (filterVal === 'general') {
        matchesFilter = !interest.includes('buy') && !interest.includes('sell') && !interest.includes('community') && !interest.includes('acquisition') && !interest.includes('purchase') && !interest.includes('valuation') && !interest.includes('representation');
      }
      
      return matchesSearch && matchesFilter;
    });

    renderInquiryRows(filtered);
  };

  function renderInquiryRows(items) {
    const tbody = $('#inquiries-tbody');
    const countBadge = $('#inquiry-count');
    if (countBadge) countBadge.textContent = `${items.length} ${items.length === 1 ? 'Entry' : 'Entries'}`;
    if (!tbody) return;

    if (items.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6" style="padding: 40px; text-align: center; color: #a39e95; font-style: italic;">
            No form submissions found.
          </td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = items.map(item => {
      const dateStr = item.created_at ? new Date(item.created_at).toLocaleString() : 'N/A';
      return `
        <tr style="border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s;" class="inquiry-row-hover">

  window.deleteInquiryRecord = function(id) {
    customConfirm('Are you sure you want to delete this submission record? This cannot be undone.', async () => {
      toast('Deleting submission...', 'info');
      try {
        const { error } = await sb.from('contact_inquiries').delete().eq('id', id);
        if (error) throw error;
        toast('Submission deleted successfully.', 'success');
        
        dbInquiries = dbInquiries.filter(x => x.id !== id);
        filterInquiries();
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  };

  window.refreshInquiries = async function() {
    toast('Refreshing inquiries...', 'info');
    try {
      const { data, error } = await sb.from('contact_inquiries').select('*');
      if (error) throw error;
      dbInquiries = data || [];
      dbInquiries.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      filterInquiries();
      toast('Inquiries updated.', 'success');
    } catch (e) {
      toast('Failed to refresh: ' + e.message, 'error');
    }
  };

  // ==========================================
  // INLINE IMAGE UPLOADER HANDLERS

  let activeImageUploadTarget = null;

  function setupImageChangeHandlers() {
    document.querySelectorAll('.edit-img-wrap').forEach(el => {
      el.addEventListener('click', () => {
        activeImageUploadTarget = {
          cmsKey: el.dataset.imgCms,
          field: el.dataset.imgField,
          blockField: el.dataset.imgBlockField,
          rowId: el.dataset.rowId,
          table: el.dataset.table,
          imgEl: el.querySelector('img')
        };
        $('#global-img-file').click();
      });
    });
  }

  $('#global-img-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !activeImageUploadTarget) return;

    toast('Uploading image to media bucket...', 'info');

    try {
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `uploads/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      
      const { error } = await sb.storage.from('media').upload(path, file, { upsert:true });
      if (error) throw error;

      const { data } = sb.storage.from('media').getPublicUrl(path);
      const url = data.publicUrl;

      // Update UI
      if (activeImageUploadTarget.imgEl) {
        activeImageUploadTarget.imgEl.src = url;
      }

      // Save key-value config immediately in target object
      if (activeImageUploadTarget.cmsKey) {
        activeImageUploadTarget.imgEl.setAttribute('data-new-val', url);
      } else if (activeImageUploadTarget.table) {
        // Save field in target cache
        const rowId = activeImageUploadTarget.rowId;
        const field = activeImageUploadTarget.field;
        
        if (activeImageUploadTarget.table === 'listings') {
          const row = dbListings.find(x => x.id === rowId);
          if (row) row[field] = url;
        } else if (activeImageUploadTarget.table === 'blog_posts') {
          const row = dbBlogs.find(x => x.id === rowId);
          if (row) row[field] = url;
        } else if (activeImageUploadTarget.table === 'communities') {
          const row = dbCommunities.find(x => x.id === rowId);
          if (row) row[field] = url;
        }
      } else if (activeImageUploadTarget.blockField) {
        // Content blocks
        const rowId = activeImageUploadTarget.rowId;
        const block = dbBlocks.find(x => x.id === rowId);
        if (block) {
          block.data[activeImageUploadTarget.blockField] = url;
        }
      }

      toast('Image updated successfully. Remember to save page changes.', 'success');
    } catch (err) {
      toast(err.message, 'error');
    }

    e.target.value = '';
    activeImageUploadTarget = null;
  });

  window.createNewInlineBlock = async function(section) {
    toast('Adding block record...', 'info');
    try {
      let dataFields = {};
      if (section === 'testimonials') {
        dataFields = { quote: 'Double-click to edit client quote review.', author: 'Client Name', detail: 'Buyer / Seller details' };
      } else if (section === 'stats') {
        dataFields = { value: '100%', label: 'Label text' };
      } else if (section === 'buyer_steps' || section === 'seller_steps') {
        dataFields = { number: '01', title: 'Step Title', description: 'Step description text...', image: '/images/1.webp' };
      }

      // Determine next position
      const siblingBlocks = dbBlocks.filter(x => x.section === section);
      const nextPos = siblingBlocks.length > 0 ? Math.max(...siblingBlocks.map(x=>x.position||0)) + 1 : 1;

      const { data, error } = await sb.from('content_blocks').insert([{
        section,
        position: nextPos,
        status: 'published',
        data: dataFields
      }]).select();

      if (error) throw error;
      
      toast('Blank content block entry added. Refreshing view...', 'success');
      await loadAllDatabaseData();
      renderActivePage();
    } catch (err) {
      toast(err.message, 'error');
    }
  };

  window.deleteInlineRecord = function(table, id) {
    customConfirm('Are you sure you want to delete this record from the database? This cannot be undone.', async () => {
      toast('Deleting record...', 'info');
      try {
        const { error } = await sb.from(table).delete().eq('id', id);
        if (error) throw error;
        toast('Deleted successfully.', 'success');
        await loadAllDatabaseData();
        renderActivePage();
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  };

  window.toggleFeaturedInline = async function(id, isFeat) {
    toast('Updating featured status...', 'info');
    try {
      const { error } = await sb.from('listings').update({ featured: isFeat }).eq('id', id);
      if (error) throw error;
      toast('Featured status updated.', 'success');
      await loadAllDatabaseData();
      renderActivePage();
    } catch (err) {
      toast(err.message, 'error');
    }
  };

  // ==========================================
  // SAVE PAGE CHANGES SERIALIZERS
  // ==========================================

  window.savePageChanges = async function() {
    const saveBtn = $('#save-page-btn');
    saveBtn.innerHTML = '<span class="spinner"></span> Saving Changes...';
    saveBtn.disabled = true;

    try {
      // 1. Gather all Inline CMS keys (site_content)
      const cmsItems = [];
      document.querySelectorAll('[data-cms]').forEach(el => {
        const key = el.dataset.cms;
        const val = el.getAttribute('data-new-val') || el.innerText.trim();
        cmsItems.push({ key, value: val, updated_at: new Date().toISOString() });
      });

      // Special case: check if any cms-images have changed on the page
      document.querySelectorAll('.edit-img-wrap[data-img-cms]').forEach(el => {
        const key = el.dataset.imgCms;
        const img = el.querySelector('img');
        if (img) {
          cmsItems.push({ key, value: img.src, updated_at: new Date().toISOString() });
        }
      });

      // Upsert CMS changes
      if (cmsItems.length > 0) {
        // Filter out duplicate keys to avoid Postgres "ON CONFLICT DO UPDATE command cannot affect row a second time" error
        const uniqueCmsItems = [];
        const seenKeys = new Set();
        for (let i = cmsItems.length - 1; i >= 0; i--) {
          const item = cmsItems[i];
          if (!seenKeys.has(item.key)) {
            seenKeys.add(item.key);
            uniqueCmsItems.push(item);
          }
        }
        uniqueCmsItems.reverse();

        console.log('uniqueCmsItems to upsert:', JSON.stringify(uniqueCmsItems, null, 2));
        const { error } = await sb.from('site_content').upsert(uniqueCmsItems, { onConflict: 'key' });
        if (error) {
          console.error('site_content upsert error:', error);
          throw error;
        }
      }

      // 2. Gather all field modifications (listings, blog_posts, communities)
      const listingUpdates = [];
      document.querySelectorAll('[data-field][data-table="listings"]').forEach(el => {
        const rowId = el.dataset.rowId;
        const field = el.dataset.field;
        const isNum = el.dataset.type === 'number';
        let rawVal = el.innerText.trim();
        
        // Strip non-numbers if numeric
        if (isNum) {
          rawVal = Number(rawVal.replace(/[^0-9.-]/g, '')) || 0;
        }

        let updateRow = listingUpdates.find(x => x.id === rowId);
        if (!updateRow) {
          updateRow = { id: rowId };
          listingUpdates.push(updateRow);
        }
        updateRow[field] = rawVal;
      });

      // Scan listing image edits
      document.querySelectorAll('.edit-img-wrap[data-table="listings"]').forEach(el => {
        const rowId = el.dataset.rowId;
        const field = el.dataset.imgField;
        const img = el.querySelector('img');
        if (img) {
          let updateRow = listingUpdates.find(x => x.id === rowId);
          if (!updateRow) {
            updateRow = { id: rowId };
            listingUpdates.push(updateRow);
          }
          updateRow[field] = img.src;
        }
      });

      // Commit listings modifications
      listingUpdates.forEach(row => {
        const orig = dbListings.find(x => x.id === row.id);
        const isSold = orig && orig.status === 'sold';
        
        if (isSold && row.address) {
          const parts = row.address.split(',').map(s => s.trim());
          const title = parts[0] || 'Sold Estate';
          let city = parts[1] || 'Texas';
          if (city.toLowerCase().startsWith('tx ') || /^\d+$/.test(city)) {
            city = 'Texas';
          }
          row.title = title;
          row.city = city;
          row.neighborhood = 'Texas';
          
          const cleanTitle = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
          row.slug = `sold-${row.id}-${cleanTitle}`;
        }
      });

      for (const item of listingUpdates) {
        item.updated_at = new Date().toISOString();
        const { id, ...payload } = item;
        const { error } = await sb.from('listings').update(payload).eq('id', id);
        if (error) throw error;
      }

      // Gather blog posts modifications
      const blogUpdates = [];
      document.querySelectorAll('[data-field][data-table="blog_posts"]').forEach(el => {
        const rowId = el.dataset.rowId;
        const field = el.dataset.field;
        const isTags = el.dataset.type === 'tags';
        let val = el.innerText.trim();

        if (isTags) {
          val = val.split(',').map(s => s.trim()).filter(Boolean);
        }

        let updateRow = blogUpdates.find(x => x.id === rowId);
        if (!updateRow) {
          updateRow = { id: rowId };
          blogUpdates.push(updateRow);
        }
        updateRow[field] = val;
      });

      // Scan blog cover image edits
      document.querySelectorAll('.edit-img-wrap[data-table="blog_posts"]').forEach(el => {
        const rowId = el.dataset.rowId;
        const field = el.dataset.imgField;
        const img = el.querySelector('img');
        if (img) {
          let updateRow = blogUpdates.find(x => x.id === rowId);
          if (!updateRow) {
            updateRow = { id: rowId };
            blogUpdates.push(updateRow);
          }
          updateRow[field] = img.src;
        }
      });

      for (const item of blogUpdates) {
        item.updated_at = new Date().toISOString();
        const { id, ...payload } = item;
        const { error } = await sb.from('blog_posts').update(payload).eq('id', id);
        if (error) throw error;
      }

      // Gather communities modifications
      const commUpdates = [];
      document.querySelectorAll('[data-field][data-table="communities"]').forEach(el => {
        const rowId = el.dataset.rowId;
        const field = el.dataset.field;
        const val = el.innerText.trim();

        let updateRow = commUpdates.find(x => x.id === rowId);
        if (!updateRow) {
          updateRow = { id: rowId };
          commUpdates.push(updateRow);
        }
        updateRow[field] = val;
      });

      // Scan community image edits
      document.querySelectorAll('.edit-img-wrap[data-table="communities"]').forEach(el => {
        const rowId = el.dataset.rowId;
        const field = el.dataset.imgField;
        const img = el.querySelector('img');
        if (img) {
          let updateRow = commUpdates.find(x => x.id === rowId);
          if (!updateRow) {
            updateRow = { id: rowId };
            commUpdates.push(updateRow);
          }
          updateRow[field] = img.src;
        }
      });

      for (const item of commUpdates) {
        item.updated_at = new Date().toISOString();
        const { id, ...payload } = item;
        const { error } = await sb.from('communities').update(payload).eq('id', id);
        if (error) throw error;
      }

      // 3. Gather content block updates ( testimonials, stats, steps )
      const blockUpdates = [];
      document.querySelectorAll('[data-block-field]').forEach(el => {
        const rowId = el.dataset.rowId;
        const field = el.dataset.blockField;
        const val = el.innerText.trim();

        let block = dbBlocks.find(x => x.id === rowId);
        if (block) {
          block.data[field] = val;
          if (!blockUpdates.includes(block)) blockUpdates.push(block);
        }
      });

      // Scan step blocks images edits
      document.querySelectorAll('.edit-img-wrap[data-img-block-field]').forEach(el => {
        const rowId = el.dataset.rowId;
        const field = el.dataset.imgBlockField;
        const img = el.querySelector('img');
        if (img) {
          let block = dbBlocks.find(x => x.id === rowId);
          if (block) {
            block.data[field] = img.src;
            if (!blockUpdates.includes(block)) blockUpdates.push(block);
          }
        }
      });

      for (const block of blockUpdates) {
        block.updated_at = new Date().toISOString();
        const { error } = await sb.from('content_blocks').update({
          data: block.data,
          updated_at: block.updated_at
        }).eq('id', block.id);
        if (error) throw error;
      }

      toast('All changes saved successfully.', 'success');
      await loadAllDatabaseData();
      renderActivePage();
    } catch (err) {
      toast('Failed to save changes: ' + err.message, 'error');
    }

    saveBtn.innerHTML = 'Save Page Changes';
    saveBtn.disabled = false;
  };

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
